<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Swiss Rust: a crab holding a Swiss army knife</title>

  <!-- Legs -->
  <g fill="none" stroke="#C2501A" stroke-width="16" stroke-linecap="round">
    <path d="M132 318 Q 82 326 58 378"/>
    <path d="M138 350 Q 92 370 82 422"/>
    <path d="M156 378 Q 120 402 120 448"/>
    <path d="M380 318 Q 430 326 454 378"/>
    <path d="M374 350 Q 420 370 430 422"/>
    <path d="M356 378 Q 392 402 392 448"/>
  </g>

  <!-- Arms -->
  <g fill="none" stroke="#C2501A" stroke-width="22" stroke-linecap="round">
    <path d="M152 282 Q 96 276 92 214"/>
    <path d="M360 282 Q 410 276 393 214"/>
  </g>

  <!-- Left claw, open -->
  <g transform="translate(90 200) rotate(-115)" fill="#E2621B">
    <circle r="36"/>
    <path d="M10 -28 Q 60 -58 98 -30 Q 60 -32 24 -6 Z"/>
    <path d="M10 28 Q 60 52 90 18 Q 56 24 24 6 Z"/>
  </g>

  <!-- Right claw gripping the Swiss army knife -->
  <g transform="translate(398 186) rotate(-55)">
    <circle cx="-30" cy="12" r="32" fill="#E2621B"/>
    <!-- blade, open -->
    <path d="M38 -13 L124 -13 Q146 -11 152 4 Q124 9 38 13 Z" fill="#E9EDF0" stroke="#6F7A84" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M50 -3 L122 -3" stroke="#BCC4CB" stroke-width="3" stroke-linecap="round"/>
    <!-- red handle with the white cross, a white rim to lift it off the crab -->
    <rect x="-60" y="-25" width="120" height="50" rx="25" fill="#D52B1E" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="-17" y="-6" width="34" height="12" rx="1.5" fill="#FFFFFF"/>
    <rect x="-6" y="-17" width="12" height="34" rx="1.5" fill="#FFFFFF"/>
    <circle cx="44" cy="0" r="4.5" fill="#8E1C13"/>
    <!-- claw finger hooked over the handle -->
    <path d="M-58 -10 Q -40 -48 -6 -36 Q -26 -30 -34 -14 Z" fill="#E2621B" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Eye stalks -->
  <g stroke="#C2501A" stroke-width="12" stroke-linecap="round">
    <line x1="222" y1="240" x2="212" y2="190"/>
    <line x1="290" y1="240" x2="300" y2="190"/>
  </g>

  <!-- Body -->
  <ellipse cx="256" cy="312" rx="142" ry="92" fill="#E2621B"/>
  <path d="M118 330 Q 256 430 394 330 Q 380 404 256 404 Q 132 404 118 330 Z" fill="#B9480F"/>
  <ellipse cx="206" cy="270" rx="40" ry="16" fill="#F28A4C" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="212" cy="184" r="22" fill="#FFFFFF" stroke="#6E2A0C" stroke-width="4"/>
  <circle cx="300" cy="184" r="22" fill="#FFFFFF" stroke="#6E2A0C" stroke-width="4"/>
  <circle cx="218" cy="186" r="10" fill="#1B1B1B"/>
  <circle cx="306" cy="186" r="10" fill="#1B1B1B"/>

  <!-- Smile -->
  <path d="M226 326 Q 256 350 286 326" fill="none" stroke="#6E2A0C" stroke-width="7" stroke-linecap="round"/>
</svg>
